[project]
name = "collections-voice-agent"
version = "0.1.0"
description = "Deterministic outbound collections voice agent with fail-closed compliance and optional Gemini STT / ElevenLabs TTS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.2",
    "streamlit>=1.54.0",
]

[project.optional-dependencies]
voice = [
    "google-genai>=3.2.0",
    "elevenlabs>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "frontend", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
